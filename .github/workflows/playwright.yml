name: Playwright Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar version de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: 3. Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install pytest playwright pytest-html

    - name: 4. Instalar navegadores de Playwright
      run: playwright install --with-deps chromium

    - name: 5. Ejecutar Smoke Test
      run: pytest tests/test_smoke.py